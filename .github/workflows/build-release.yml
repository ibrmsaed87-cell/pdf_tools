name: Build Docvra Release APK and AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Verify release signing files
        run: |
          test -f signing/docvra-release.jks || { echo "Release keystore is missing"; exit 1; }
          test -f signing/keystore.properties || { echo "Keystore properties are missing"; exit 1; }

      - name: Build release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Verify release artifacts
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          test -n "$APK" || { echo "Release APK not found"; exit 1; }
          test -n "$AAB" || { echo "Release AAB not found"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Docvra-v2-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Docvra-v2-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
